<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opencode Workspace · {{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='34' rx='5' fill='%236a55c9'/%3E%3Crect x='14' y='20' width='36' height='22' rx='3' fill='%23fff'/%3E%3Crect x='26' y='48' width='12' height='6' fill='%236f6a62'/%3E%3C/svg%3E">
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("/workspace/assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
}
:root {
  --bg: #efeae3;
  --panel: rgba(255, 255, 255, .9);
  --line: #e6dfd5;
  --line-strong: #d6cdc0;
  --text: #2b2a28;
  --muted: #6f6a62;
  --faint: #8f887e;
  --ok: #23874f;
  --work: #1f9d57;
  --done: #0f7f8f;
  --idle: #8a8378;
  --bad: #c43d3d;
  --radius: 14px;
  --topH: 48px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html[data-theme="dark"] {
  --bg: #1c1a18;
  --panel: rgba(32, 30, 28, .94);
  --line: #3a352f;
  --line-strong: #4a443c;
  --text: #ece7df;
  --muted: #b3aa9d;
  --faint: #8f877a;
  color-scheme: dark;
}
html[data-theme="dark"] .top .card-ui { background: #242220; }
html[data-theme="dark"] .side { background: #242220; }
html[data-theme="dark"] .chip { background: #2c2925; }
html[data-theme="dark"] .feed li.fresh { background: #2e2a24; }
html[data-theme="dark"] .feed .txt { color: #d6cfc4; }
html[data-theme="dark"] .feed li.k-text .txt { color: var(--muted); }
html[data-theme="dark"] .run:hover { background: #2e2a24; }
html[data-theme="dark"] .tabs button .n { background: #3a352f; color: var(--muted); }
html[data-theme="dark"] .banner { background: #3a2f10; border-color: #8a6d1c; color: #f5d67a; }
html[data-theme="dark"] .stat a { color: #a99fff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#scene { position: fixed; left: 0; right: 0; bottom: 0; top: var(--topH); }
#scene canvas { display: block; touch-action: none; }
.labels { position: fixed; inset: 0; pointer-events: none; }
button { font: inherit; color: inherit; }
.card-ui { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(60, 45, 25, .08); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar — docked, not floating */
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 0; align-items: stretch; z-index: 5; }
.top > * { pointer-events: auto; }
.top .card-ui { border-radius: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; border-bottom: 1px solid var(--line); background: #fff; }
.brand { flex: 1; padding: 6px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 0; border-right: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.brand p { margin: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand p[hidden] { display: none; }
.stats { display: flex; padding: 0; overflow: hidden; flex: none; }
.stat { padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat small { color: var(--muted); font-size: 10px; white-space: nowrap; }
.stat b { font: 600 14px/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .live { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1.2 var(--sans); white-space: nowrap; }
.stat a { color: #4b3fb0; font-weight: 600; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--work); flex: none; animation: blink 2s infinite; }
.dot.off { background: var(--bad); animation: none; }
@keyframes blink { 50% { opacity: .35; } }

.banner { position: fixed; top: calc(var(--topH) + 8px); left: 50%; transform: translateX(-50%); z-index: 6; padding: 8px 16px; border-radius: 99px; font-weight: 600; font-size: 12.5px; display: none; max-width: calc(100vw - 32px); background: #fff4d6; border: 1px solid #f0d58a; color: #6b4d00; box-shadow: 0 6px 20px rgba(60,45,25,.12); text-align: center; }
.banner.show { display: block; }

/* side panel — one right-hand panel, two tabs (subagent + activity), always open */
.side { position: fixed; top: var(--topH); bottom: 0; display: flex; flex-direction: column; overflow: hidden; z-index: 4; border-radius: 0; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; background: #fff; }
.side.right { right: 0; width: 320px; border-left: 1px solid var(--line); }
.side header { padding: 8px 10px 7px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
.side header h2 { margin: 0; font-size: 12.5px; font-weight: 700; }
.hright { display: flex; align-items: center; gap: 6px; }
.scroll { overflow-y: auto; overflow-x: hidden; flex: 1; scrollbar-width: thin; scrollbar-color: #d6cdc0 transparent; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; background: #fff; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.feedfilter { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.feedfilter button { border: 1px solid var(--line-strong); background: #fff; color: var(--muted); border-radius: 99px; font-size: 11px; font-weight: 600; padding: 2px 10px; cursor: pointer; }
.feedfilter button[aria-pressed="true"] { background: #2b2a28; border-color: #2b2a28; color: #fff; }
.runsearch { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.runsearch input { width: 100%; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 9px; font: inherit; font-size: 12px; background: #fff; color: var(--text); }
.runsearch input::placeholder { color: var(--faint); }
html[data-theme="dark"] .feedfilter button { background: #2c2925; }
/* Batch E: project switcher (select) */
#projSel { max-width: 170px; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 99px; font-size: 11px; font-weight: 600; background: #fff; color: var(--muted); cursor: pointer; }
#projSel:hover { color: var(--text); border-color: var(--text); }
html[data-theme="dark"] #projSel { background: #2c2925; }
html[data-theme="dark"] .feedfilter button[aria-pressed="true"] { background: #ece7df; border-color: #ece7df; color: #242220; }
html[data-theme="dark"] .runsearch input { background: #2c2925; }

.feed { list-style: none; margin: 0; padding: 6px 0; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; padding: 5px 12px; }
.feed li.fresh { animation: in .6s ease both; background: #fbf6ec; }
.feed .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11.5px; }
.feed .meta { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.feed .who { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed time { font: 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.feed .txt { color: #3d3a36; overflow-wrap: anywhere; }
.feed li.k-text .txt { color: var(--muted); font-style: italic; }
.feed li.k-assign .txt { font-weight: 600; }
.feed li.k-done .txt::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.feed li.k-resume .txt::before { content: "↻ "; color: var(--done); font-weight: 700; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* done/fail notif (Batch C): toast + mute button, no emoji */
.mute { background: none; border: 1px solid var(--line-strong); border-radius: 99px; padding: 1px 9px; font-size: 10.5px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.mute:hover { color: var(--text); border-color: var(--muted); }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 8; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; position: relative; background: #fff; border: 1px solid var(--line-strong); border-left: 4px solid var(--ok); border-radius: 10px; box-shadow: 0 8px 26px rgba(60,45,25,.16); padding: 8px 30px 8px 12px; animation: in .3s ease both; }
.toast.fail { border-left-color: var(--bad); }
.toast .tt { font-weight: 700; font-size: 12px; }
.toast.fail .tt { color: var(--bad); }
.toast.ok .tt { color: var(--ok); }
.toast p { margin: 2px 0 0; color: #3d3a36; font-size: 12px; overflow-wrap: anywhere; }
.toast .tx { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; background: none; color: var(--faint); font-size: 15px; line-height: 1; cursor: pointer; border-radius: 6px; }
.toast .tx:hover { color: var(--text); background: #f3ede4; }
html[data-theme="dark"] .toast { background: #242220; }
html[data-theme="dark"] .toast p { color: #d6cfc4; }
html[data-theme="dark"] .toast .tx:hover { background: #3a352f; }

.tabrow { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-right: 8px; }
.tabs { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; background: none; border: 0; padding: 9px 4px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tabs button .n { display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: #eee7dc; font-size: 10.5px; line-height: 16px; color: var(--muted); }
.pane { display: none; padding: 10px 12px 14px; }
.pane.on { display: block; }
.pane[data-pane="activity"] { padding: 0; }
.empty { color: var(--faint); padding: 18px 6px; text-align: center; font-size: 12.5px; }
.src { margin: 2px 2px 10px; font-size: 11.5px; color: var(--muted); }
.run { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; padding: 7px 8px; border-radius: 9px; align-items: baseline; }
.run:hover { background: #faf6ef; }
.run .c { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
.run .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .w { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todo { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; padding: 4px 8px; font-size: 12.5px; }
.todo i { font-style: normal; color: var(--faint); }
.todo.s-in_progress i { color: var(--ok); }
.todo.s-completed span { color: var(--faint); text-decoration: line-through; }

/* bottom character cards — removed */
.cards, .card { display: none !important; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(60,45,25,.14); }
.card:focus-visible { outline: 2px solid #4b3fb0; outline-offset: 2px; }
.card .ava { grid-row: 1 / span 3; width: 38px; height: 38px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; position: relative; }
.card.working .ava::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: #2fbf71; border: 2px solid #fff; }
.card .h { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; row-gap: 2px; }
.card .nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.card .role { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.card .st { margin-left: auto; }
.card .task { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .act { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.more { cursor: default; --c: #8a8378; }
.card.more:hover { transform: none; }

/* label overlay: name + bubble */
.person { transform: translateY(-4px); text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.person.out { display: none; }
.bubble { max-width: 220px; padding: 6px 10px; border-radius: 12px; background: #fff; color: #2b2a28; font-size: 11.5px; line-height: 1.35; box-shadow: 0 4px 14px rgba(60,45,25,.18); position: relative; border: 1px solid #eadfce; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: #fff; border-right: 1px solid #eadfce; border-bottom: 1px solid #eadfce; transform: translateX(-50%) rotate(45deg); }
.bubble.hide { display: none; }
.bubble.hi { background: #e9f8ef; border-color: #b6e3c6; font-weight: 600; } .bubble.hi::after { background: #e9f8ef; border-color: #b6e3c6; }
.tag { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #fff; background: var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.18); white-space: nowrap; }
.tag small { font-weight: 500; opacity: .9; }

/* actor detail — docked overlay top-right of map, fixed layout */
#detailBackdrop { position: fixed; top: var(--topH); left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(43,42,40,.18); }
#detailBackdrop[hidden] { display: none; }
#actorDetail { position: fixed; top: calc(var(--topH) + 12px); right: 332px; width: 300px; max-width: calc(100vw - 24px); max-height: calc(100vh - var(--topH) - 24px); overflow: auto; z-index: 7; padding: 12px 14px 14px; }
#actorDetail[hidden] { display: none; }
#actorDetail .ad-head { display: flex; gap: 10px; align-items: center; }
#actorDetail .ad-ava { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; flex: none; }
#actorDetail .ad-name { font-weight: 700; font-size: 13.5px; }
#actorDetail .ad-role { color: var(--muted); font-size: 11.5px; }
#actorDetail .ad-close { margin-left: auto; border: 1px solid var(--line-strong); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: 600; }
#actorDetail .ad-close:focus-visible { outline: 2px solid #4b3fb0; outline-offset: 2px; }
#actorDetail .ad-task { font-weight: 600; margin: 10px 0 4px; overflow-wrap: anywhere; white-space: normal; }
#actorDetail .ad-row { display: flex; gap: 6px; font-size: 12px; margin-top: 4px; }
#actorDetail .ad-row b { min-width: 88px; color: var(--muted); font-weight: 600; flex: none; }
#actorDetail .ad-row span { min-width: 0; overflow-wrap: anywhere; }
#actorDetail .ad-ids { font-family: var(--mono); font-size: 11.5px; }
#labels [data-actor] { pointer-events: auto; cursor: pointer; }
html[data-theme="dark"] #actorDetail .ad-close { background: #2c2925; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg); transition: opacity .8s; }
.loading.gone { opacity: 0; pointer-events: none; }
.loading div { text-align: center; color: var(--muted); font-size: 13px; }
.loading i { display: block; width: 160px; height: 3px; margin: 12px auto 0; border-radius: 99px; background: linear-gradient(90deg, transparent, #6a55c9, transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: load 1.2s linear infinite; }
@keyframes load { from { background-position: -100% 0; } to { background-position: 200% 0; } }
.nogl { position: fixed; inset: 0; display: none; place-items: center; z-index: 1; color: var(--muted); padding: 24px; text-align: center; }
body.nogl-on .nogl { display: grid; }

@media (max-width: 1180px) {
  .side.right { width: 300px; }
  #actorDetail { right: 312px; }
}
@media (max-width: 820px) {
  .top { flex-wrap: wrap; top: 0; left: 0; right: 0; gap: 0; }
  .brand { flex: 1 1 100%; border-right: 0; }
  .brand p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stats { flex: 1 1 100%; }
  .stat { flex: 1 1 0; padding: 7px 12px; }
  .stat b { font-size: 14px; }
  .banner { top: auto; bottom: 46vh; }
  .side.right { top: auto; left: 0; right: 0; width: auto; bottom: 0; height: 38vh; border-left: 0; border-top: 1px solid var(--line); }
  .bubble { max-width: 150px; font-size: 10.5px; }
  #actorDetail { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 46vh; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="loading" id="loading"><div>Setting up workspace…<i></i></div></div>
<div id="scene" aria-hidden="true"></div>
<div class="labels" id="labels" aria-hidden="true"></div>
<div id="detailBackdrop" hidden></div>
<aside id="actorDetail" class="card-ui" role="dialog" aria-modal="true" aria-labelledby="adName" tabindex="-1" hidden>
  <div class="ad-head"><span class="ad-ava" id="adAvatar">?</span><div><div class="ad-name" id="adName">–</div><div class="ad-role" id="adRole">–</div></div><button type="button" class="ad-close" id="adClose">Close</button></div>
  <div style="margin-top:8px"><span class="chip" id="adStatus"><i></i>Idle</span></div>
  <div class="ad-task" id="adTask">Idle — no active task.</div>
  <div class="ad-row"><b>Session</b><span class="ad-ids" id="adSession">–</span></div>
  <div class="ad-row"><b>Run</b><span class="ad-ids" id="adRun">–</span></div>
  <div class="ad-row" id="adParentRow" hidden><b>Requested by</b><span id="adParent">–</span></div>
  <div class="ad-row"><b>Activity</b><span id="adLast">–</span></div>
  <div class="ad-row"><b>Updated</b><span id="adUpdated">–</span></div>
</aside>
<div class="nogl">This browser does not support Canvas 2D. Activity panel still works.</div>

<div class="top">
  <div class="brand card-ui">
    <h1>Opencode Workspace <span>· {{TITLE}}</span></h1>
    <p id="sessLine" hidden><span id="sessTitle"></span></p>
  </div>
  <div class="stats card-ui">
    <div class="stat"><small>Status</small><span class="live"><i class="dot" id="liveDot"></i><span id="liveTxt">Connecting…</span></span></div>
    <div class="stat"><small>Active now</small><b id="sActive">–</b></div>
    <div class="stat" id="projStat" hidden><small>Project</small><select id="projSel" aria-label="Switch project"><option value="">Switch…</option></select></div>
    <div class="stat" id="pubStat" hidden><small>Public URL</small><a id="pubLink" href="#" target="_blank" rel="noopener noreferrer">open</a></div>
  </div>
</div>

<div class="banner" id="banner" role="status"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<aside id="sideRight" class="side right card-ui" aria-label="Workspace activity">
  <header><h2>Workspace</h2><span class="hright"><button class="mute" id="muteBtn" type="button" aria-pressed="false" title="Mute done/fail sounds">Sound: on</button></span></header>
  <div class="tabrow">
    <div class="tabs" role="tablist">
      <button type="button" data-tab="agents" role="tab" aria-selected="true">Subagent<span class="n" id="nActive">0</span></button>
      <button type="button" data-tab="activity" role="tab" aria-selected="false">Activity<span class="n" id="feedCount">0</span></button>
    </div>
  </div>
  <div class="scroll">
    <section class="pane on" data-pane="agents" id="paneActive"></section>
    <section class="pane" data-pane="activity">
      <div class="feedfilter" id="feedFilter" role="group" aria-label="Filter activity"><button type="button" data-fcat="all" aria-pressed="true">All</button><button type="button" data-fcat="text" aria-pressed="false">Text</button><button type="button" data-fcat="tool" aria-pressed="false">Tool</button><button type="button" data-fcat="ask" aria-pressed="false">Ask</button><button type="button" data-fcat="done" aria-pressed="false">Done</button></div>
      <ul class="feed" id="feed"></ul>
    </section>
  </div>
</aside>

{{CONFIG_SCRIPT}}
<!-- work-status-card: name pill + green dot, "Working · <relative>", task description (canvas, no assets) -->
<script src="/workspace/assets/workspace.js?v=240"></script>
</body>
</html>
